name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (D-Bus)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus-x11 dbus-bin

      - name: Syntax and bytecode compilation
        run: |
          python3 -m py_compile src/ags/*.py tests/*.py

      - name: Run automated test suite
        run: |
          python3 -m unittest discover -v tests

      - name: Test installer script (disposable environment)
        run: |
          ./install.sh --check
          TMP_DIR=$(mktemp -d)
          ./install.sh --prefix "${TMP_DIR}"
          test -L "${TMP_DIR}/bin/ags"
          "${TMP_DIR}/bin/ags" --version
          "${TMP_DIR}/bin/ags" list
          ./install.sh --prefix "${TMP_DIR}" --uninstall
          test ! -e "${TMP_DIR}/bin/ags"
          rm -rf "${TMP_DIR}"

      - name: Security and credentials leakage scan
        run: |
          echo "Scanning tracked files for accidental secrets..."
          # Reject any tracked files matching sensitive credential filenames
          if git ls-files | grep -E "(antigravity-oauth-token|conversation_summaries\.db|\.pbtxt|\.pb)$"; then
            echo "ERROR: Tracked files contain sensitive credential or runtime data artifacts!"
            exit 1
          fi

          # Scan committed code for real refresh or private tokens
          if git grep -I -i -E "(ya29\.[0-9a-zA-Z_-]{20,}|1//0[0-9a-zA-Z_-]{20,})" -- ':!tests/' ':!prototype/'; then
            echo "ERROR: Real Google OAuth token patterns found in repository code!"
            exit 1
          fi
          echo "Security scan clean: no secrets committed."
